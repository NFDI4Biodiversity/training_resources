name: Introduction to Research Data Management
description: >-
  This lecture was part of the NFDI4Biodiversity & HeFDI & iDiv Seasonal School
  on Data Management in Biodiversity and Environmental Science. It introduces
  fundamental principles of research data management (RDM) and data literacy,
  highlighting best practices for organizing, storing, documenting, and sharing
  data according to the FAIR principles. Participants were guided through the
  research data life cycle and explored how to design data management strategies
  that meet funder and institutional requirements while improving the
  reproducibility and impact of their research.


  The NFDI4Biodiversity & HeFDI & iDiv Seasonal School on Data Management in
  Biodiversity and Environmental Science is a joint initiative by the
  NFDI4Biodiversity consortium, the Hessian Research Data Infrastructure
  (HeFDI), and the German Centre for Integrative Biodiversity Research (iDiv).
  The intensive five-day program combines conceptual input with hands-on
  practice, equipping early-career researchers with the skills to manage
  biodiversity and environmental data throughout its life cycle.


  Contact: forschungsdaten@uni-kassel.de 
