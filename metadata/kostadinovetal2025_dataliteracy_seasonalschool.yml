name: Data Management and Data Literacy
description: >

  Description


  This lecture was part of the NFDI4Biodiversity & iDiv Seasonal School on Data
  Management in Biodiversity and Environmental Science introduces key principles
  of data management and data literacy, emphasizing best practices for
  organizing, storing, and handling data according to FAIR principles. You will
  explore various data types in biodiversity and environmental science and learn
  how to align your research data management (RDM) strategies with funding
  requirements and institutional policies.


  The NFDI4Biodiversity & iDiv Seasonal School on Data Management in
  Biodiversity and Environmental Science was a collaboration between the German
  Centre for Integrative Biodiversity Research (iDiv) and the NFDI4Biodiversity
  consortium. This course offered cutting-edge skills and knowledge essential
  for handling scientific data throughout its life cycle. The intensive five-day
  program combined direct knowledge transfer with practical lessons to introduce
  participants to fundamental and advanced tools in research data management
  (RDM), tailored to enhance their future careers.


  An updated version with a focus on Data Managemen Plans was presented at the
  third Seasonal School on Data Management in Biodiversity and Environmental
  Science, organised jointly by NFDI4Biodiversity, the Hessian Research Data
  Infrastructure HeFDI and the German Centre for Integrative Biodiversity
  Research iDiv.
