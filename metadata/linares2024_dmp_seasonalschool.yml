name: DMPs as part of local organisation, FAIRness and policy compliance
description: >-
  The NFDI4Bio & iDiv Seasonal School on Data Management in Biodiversity and
  Environmental Science collaborates with the German Centre for Integrative
  Biodiversity Research (iDiv) and the consortium NFDI4Biodiversity. The school
  offers cutting-edge skills and knowledge for handling scientific data
  throughout its life cycle. As part of the intensive five-day program in
  research data management (RDM), participants will learn about data management
  practices and, with the guidance through the GFBio DMP Tool, will create a
  Data Management Plan (DMP)
