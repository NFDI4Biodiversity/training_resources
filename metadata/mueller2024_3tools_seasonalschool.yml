name: Three useful tools to get data in shape
description: >-
  Material for a 2 hour short course about using three tools for bringing tables
  in shape, as part of the NFDI4Biodiversity iDiv Seasonal School 2024. The
  tools in question are OpenRefine, RightField, and ReStoRunT. The presentation
  mainly consists of step-by-step screenshots.
