name: >-
  Template for the NFDI4Biodiversity & iDiv Seasonal School on Data Management
  in Ecology and Environmental Science 2024
description: >-
  The NFDI4Biodiversity & iDiv Seasonal School on Data Management in
  Biodiversity and Environmental Science 2024 was a collaboration between the German
  Centre for Integrative Biodiversity Research (iDiv) and the NFDI4Biodiversity
  consortium. This course offered cutting-edge skills and knowledge essential
  for handling scientific data throughout its life cycle. The intensive five-day
  program combined direct knowledge transfer with practical lessons to introduce
  participants to fundamental and advanced tools in research data management
  (RDM), tailored to enhance their future careers.

  This is a playlist of 13 lecture recordings. For all recorded lectures, you can
  find additional training materials on Zenodo (https://t1p.de/4Biodiv-SeasonalSchool2024).
