name: Geospatial Data Collection with the Qfield app
description: >-
  The slides accompany the practical session on "Geospatial data collection with
  the Qfield app" as part of the 2025 NFDI4Biodiversity & HeFDI & iDiv Seasonal
  School on Data Management in Biodiversity and Environmental Science. The
  session provided a topical input on Qfield as a geospatial data collection
  tool and practical instructions for the practical example Qfield project.

  During the workshop, the participants used Qfield to collect a traits dataset
  of 70 tree points, which were synchronized directly into one QGIS project. The
  participants learned how the project was set up in QGIS for the use in the
  Qfield app, with a choice of data types, contraints, and default values.
  Further, the workshop covered how collaborative data collection is enabled via
  QfieldCloud.
