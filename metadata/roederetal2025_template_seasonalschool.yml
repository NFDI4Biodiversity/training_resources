name: Template for the NFDI4Biodiversity & iDiv Seasonal School on Data Management in Ecology and Environmental Science 2024
description: >
  This document describes a one-week course program for a Seasonal School on
  research data management (RDM) from 2024 which was organised for the second
  time by partners from the NFDI4Biodiversity consortium. The course aimed to
  provide young scientists in ecology and environmental science with
  state-of-the-art skills and knowledge in handling scientific data throughout
  the data life cycle. Lectures and practical sessions were given by experts
  from renowned universities, data centers, and research institutions in the
  environmental research community, covering general aspects of RDM and aspects
  specifically important for handling ecological data. The participants were
  introduced to Jupyter notebooks and learned how to combine software tools like
  Jupyter, R, GitHub, spreadsheet tools, and NFDI4Biodiversity Tools and
  Services. The course was conducted remotely and targeted PhD students (R1).
  This publication summarises detailed information about the structure,
  organisation, and lessons learned, and is supposed to be used as a guide for
  similar events.

  We list all course materials (presentation slides, video recordings, code,
  Jupyter notebooks, trainings data sets) and accounts required to follow the
  course program in your own pace. Additional code and training data sets are
  available here: https://doi.org/10.5281/zenodo.15594632. The course requires a
  minimum of programming skills in R (Python is optional).
