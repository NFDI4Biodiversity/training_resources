type: LearningResource
name: Taxonomic name harmonization
description: >-
  The presentations and scripts give an introduction to taxonomic name
  harmonization, the process of cleaning and resolving scientific names to work
  with organismic data from different sources.

  This resource was initially created for the NFDI Seasonal School 2024. The
  2025 update features small adaptations and improvements to the jupyter
  notebooks, reflecting changes in the GBIF API and/or rgbif R package and
  comments from users. Additionally, the presentation on the topic has been
  greatly expanded including a full walkthrough of the name parsing and name
  resolution workbooks.


  For those not wanting to use jupyter notebooks the html files provide the same
  content as the ipynb files including results of computations, they are just
  not interactive.
