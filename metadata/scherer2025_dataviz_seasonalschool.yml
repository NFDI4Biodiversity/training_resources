name: Data Analysis & Visualisation According to FAIR Principles
description: >-
  The slides, R script, and Jupyter notebook for the workshop lesson "Data
  Analysis & Visualisation According to FAIR Principles" as part of the
  "NFDI4Biodiversity Seasonal School 2024" and the subsequent edition as part of
  the follow-up course "NFDI4Biodiversity & HeFDI & iDiv Seasonal School 2025". 


  The lesson covers the principles of the data science workflow, using R and the
  tidyverse, with a focus on data visualization principles and the grammar of
  graphics with the ggplot2 package.
